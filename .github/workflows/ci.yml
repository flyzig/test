# ------------------------------------------------------------------
# CI (Intégration Continue) du projet WordPress de test de plugins
#
# Ce fichier est lu automatiquement par GitHub Actions.
# À chaque "push" ou "pull request", GitHub lance une machine
# virtuelle Linux et exécute les "jobs" ci-dessous.
# Résultats : onglet "Actions" du dépôt sur github.com
# ------------------------------------------------------------------
name: CI

# Quand le workflow se déclenche
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

# Liste des plugins "maison" à vérifier (séparés par des espaces).
# Ajoutez ici le dossier de chaque nouveau plugin que vous créez.
env:
  PLUGINS: mon-plugin-test

jobs:
  # ---------------------------------------------------------------
  # 1) Vérifie que le code PHP n'a pas d'erreur de syntaxe,
  #    sur plusieurs versions de PHP en parallèle ("matrix").
  # ---------------------------------------------------------------
  lint:
    name: Syntaxe PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l sur les plugins
        run: |
          for p in $PLUGINS; do
            find "wp-content/plugins/$p" -name '*.php' -print0 | xargs -0 -n1 php -l
          done

  # ---------------------------------------------------------------
  # 2) Vérifie le style de code (WordPress Coding Standards).
  #    Informatif : n'empêche pas le CI de passer au vert.
  # ---------------------------------------------------------------
  standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Installer PHPCS + WPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction wp-coding-standards/wpcs:"^3.0"

      - name: Lancer PHPCS
        run: |
          BIN="$(composer global config bin-dir --absolute --quiet)"
          for p in $PLUGINS; do
            "$BIN/phpcs" --standard=phpcs.xml.dist "wp-content/plugins/$p"
          done

  # ---------------------------------------------------------------
  # 3) Test réel : installe WordPress avec une base MySQL,
  #    active le plugin et vérifie qu'il fonctionne.
  # ---------------------------------------------------------------
  smoke-test:
    name: Test WordPress + plugin
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Créer wp-config.php
        run: |
          wp config create --dbname=wp_test --dbuser=root --dbpass=root \
            --dbhost=127.0.0.1:3306 --skip-check --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          PHP

      - name: Installer WordPress
        run: |
          wp core install --url=http://localhost --title="CI" \
            --admin_user=admin --admin_password=admin \
            --admin_email=ci@example.com --skip-email

      - name: Activer les plugins
        run: wp plugin activate $PLUGINS

      - name: Tester le shortcode de mon-plugin-test
        run: |
          out=$(wp eval 'echo do_shortcode("[mpt_hello nom=\"CI\"]");')
          echo "Résultat : $out"
          echo "$out" | grep -q "Bonjour depuis Mon Plugin Test"

      - name: Vérifier qu'il n'y a pas d'erreur PHP
        run: |
          if [ -f wp-content/debug.log ]; then
            cat wp-content/debug.log
            if grep -E "PHP (Fatal error|Parse error|Warning)" wp-content/debug.log; then
              echo "::error::Erreurs PHP détectées dans debug.log"
              exit 1
            fi
          fi
